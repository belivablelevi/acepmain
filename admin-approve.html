<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Approve Submissions</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
    }
    .submission-card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .submission-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #f3f4f6;
    }
    .status-badge {
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.875rem;
    }
    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .photo-grid img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .photo-grid img:hover {
      transform: scale(1.05);
    }
    .action-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .btn-approve {
      background: #059669;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    .btn-approve:hover {
      background: #047857;
    }
    .btn-reject {
      background: #ef4444;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    .btn-reject:hover {
      background: #dc2626;
    }
    .info-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin: 0.5rem 0;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1 style="font-size: 3rem; font-weight: 800; color: #059669; margin-bottom: 2rem;">
      Admin - Approve Submissions
    </h1>
    
    <div id="submissionsContainer">
      <p style="text-align: center; color: #6b7280; padding: 3rem;">Loading pending submissions...</p>
    </div>
  </div>

  <script src="scripts/firebase-config.js"></script>
  <script>
    let pendingSubmissions = [];

    async function loadPendingSubmissions() {
      try {
        const snapshot = await db.collection('submissions')
          .where('status', '==', 'pending')
          .orderBy('submittedDate', 'desc')
          .get();
        
        pendingSubmissions = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        
        renderSubmissions();
      } catch (error) {
        console.error('Error loading submissions:', error);
        document.getElementById('submissionsContainer').innerHTML = `
          <div style="text-align: center; padding: 3rem;">
            <p style="color: #ef4444; font-weight: 600;">Error loading submissions!</p>
            <p style="color: #6b7280; margin-top: 1rem;">Make sure Firestore rules allow reading submissions.</p>
          </div>
        `;
      }
    }

    function renderSubmissions() {
      const container = document.getElementById('submissionsContainer');
      
      if (pendingSubmissions.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem; background: white; border-radius: 16px;">
            <h2 style="color: #059669;">✅ All caught up!</h2>
            <p style="color: #6b7280; margin-top: 1rem;">No pending submissions to review.</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = pendingSubmissions.map(sub => {
        const date = sub.submittedDate?.toDate ? 
          new Date(sub.submittedDate.toDate()).toLocaleDateString('en-CA', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }) : 'Unknown date';
        
        return `
          <div class="submission-card">
            <div class="submission-header">
              <div>
                <h2 style="margin: 0 0 0.5rem 0; color: #111827;">${sub.challengeTitle}</h2>
                <div class="info-row">
                  <i data-lucide="user" width="16" height="16"></i>
                  <span>${sub.userName || sub.userEmail}</span>
                </div>
                <div class="info-row">
                  <i data-lucide="calendar" width="16" height="16"></i>
                  <span>${date}</span>
                </div>
                ${sub.location ? `
                  <div class="info-row">
                    <i data-lucide="map-pin" width="16" height="16"></i>
                    <span>${sub.location}</span>
                  </div>
                ` : ''}
              </div>
              <div>
                <span class="status-badge status-pending">PENDING</span>
                <div style="margin-top: 1rem; text-align: right;">
                  <strong style="color: #059669; font-size: 1.25rem;">${sub.points} points</strong>
                </div>
              </div>
            </div>
            
            <h3 style="font-weight: 700; margin-bottom: 0.5rem;">Description:</h3>
            <p style="color: #374151; line-height: 1.6; margin-bottom: 1.5rem;">${sub.description}</p>
            
            <h3 style="font-weight: 700; margin-bottom: 1rem;">Photos:</h3>
            <div class="photo-grid">
              ${sub.photos ? sub.photos.map((photo, i) => `
                <img src="${photo}" alt="Submission photo ${i+1}" onclick="window.open('${photo}', '_blank')">
              `).join('') : '<p>No photos</p>'}
            </div>
            
            <div class="action-buttons">
              <button class="btn-approve" onclick="approveSubmission('${sub.id}', ${sub.points}, '${sub.userId}', '${sub.challengeId}')">
                <i data-lucide="check-circle" width="20" height="20" style="display: inline; vertical-align: middle;"></i>
                Approve & Award ${sub.points} Points
              </button>
              <button class="btn-reject" onclick="rejectSubmission('${sub.id}')">
                <i data-lucide="x-circle" width="20" height="20" style="display: inline; vertical-align: middle;"></i>
                Reject
              </button>
            </div>
          </div>
        `;
      }).join('');
      
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    async function approveSubmission(submissionId, points, userId, challengeId) {
      if (!confirm('Approve this submission and award points?')) return;
      
      try {
        // Update submission status
        await db.collection('submissions').doc(submissionId).update({
          status: 'approved',
          approvedDate: firebase.firestore.FieldValue.serverTimestamp(),
          reviewed: true
        });
        
        // Award points to user
        const userRef = db.collection('users').doc(userId);
        const userDoc = await userRef.get();
        
        if (userDoc.exists) {
          await userRef.update({
            points: firebase.firestore.FieldValue.increment(points),
            challengesCompleted: firebase.firestore.FieldValue.arrayUnion(challengeId),
            lastActivity: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          // Update badge based on new total
          const userData = (await userRef.get()).data();
          const totalPoints = userData.points || 0;
          let badge = '🌱';
          if (totalPoints >= 5000) badge = '🏆';
          else if (totalPoints >= 3000) badge = '🦸';
          else if (totalPoints >= 2000) badge = '🏅';
          else if (totalPoints >= 1000) badge = '⭐';
          else if (totalPoints >= 500) badge = '🌳';
          else if (totalPoints >= 200) badge = '🌿';
          
          await userRef.update({ badge });
        }
        
        alert('✅ Submission approved and points awarded!');
        loadPendingSubmissions(); // Reload list
        
      } catch (error) {
        console.error('Error approving:', error);
        alert('Error: ' + error.message);
      }
    }

    async function rejectSubmission(submissionId) {
      if (!confirm('Reject this submission? User will NOT get points.')) return;
      
      try {
        await db.collection('submissions').doc(submissionId).update({
          status: 'rejected',
          rejectedDate: firebase.firestore.FieldValue.serverTimestamp(),
          reviewed: true
        });
        
        alert('❌ Submission rejected');
        loadPendingSubmissions(); // Reload list
        
      } catch (error) {
        console.error('Error rejecting:', error);
        alert('Error: ' + error.message);
      }
    }

    // Load on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadPendingSubmissions();
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
