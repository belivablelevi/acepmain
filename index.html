<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACEP - Alliance for Canadian Environmental Protection</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase v9 modular SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, limit, updateDoc, doc, getDoc, onSnapshot, increment, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';
    
    const firebaseConfig = {
      apiKey: "AIzaSyDeq9Cpi8Jr4hGQOh2YOPQR-GYvlhRr8nQ",
      authDomain: "acep-11d20.firebaseapp.com",
      projectId: "acep-11d20",
      storageBucket: "acep-11d20.firebasestorage.app",
      messagingSenderId: "648606466091",
      appId: "1:648606466091:web:5fa808c5b474239d512a6e"
    };
    
    const app = initializeApp(firebaseConfig);
    window.firebaseAuth = getAuth(app);
    window.firebaseDb = getFirestore(app);
    window.firebaseStorage = getStorage(app);
    
    window.firebaseFunctions = {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      collection,
      addDoc,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      updateDoc,
      doc,
      getDoc,
      onSnapshot,
      increment,
      setDoc,
      ref,
      uploadBytes,
      getDownloadURL
    };
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #a7f3d0 100%);
      background-attachment: fixed;
      color: #1d1d1f;
      line-height: 1.47059;
      font-weight: 400;
      letter-spacing: -0.022em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    #root {
      min-height: 100vh;
    }
    
    /* Glass morphism effect */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    
    .glass-dark {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    
    /* Navigation - Apple style */
    .nav {
      background: rgba(251, 251, 253, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 22px;
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    
    .nav-logo {
      font-size: 21px;
      font-weight: 600;
      color: #1d1d1f;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -0.5px;
    }
    
    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
      align-items: center;
    }
    
    .nav-link {
      color: #1d1d1f;
      text-decoration: none;
      font-size: 12px;
      font-weight: 400;
      transition: opacity 0.3s;
      cursor: pointer;
      opacity: 0.8;
    }
    
    .nav-link:hover,
    .nav-link.active {
      opacity: 1;
    }
    
    .nav-auth {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    /* Buttons - Apple style with light green */
    .btn {
      padding: 12px 24px;
      border-radius: 980px;
      border: none;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      letter-spacing: -0.016em;
    }
    
    .btn-primary {
      background: rgba(52, 211, 153, 0.95);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(52, 211, 153, 0.25);
    }
    
    .btn-primary:hover {
      background: rgba(52, 211, 153, 1);
      box-shadow: 0 4px 16px rgba(52, 211, 153, 0.35);
      transform: scale(1.02);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.85);
      color: #1d1d1f;
      border: 1px solid rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(20px);
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    
    .btn-ghost {
      background: transparent;
      color: #1d1d1f;
    }
    
    .btn-ghost:hover {
      background: rgba(0, 0, 0, 0.04);
    }
    
    .btn-small {
      padding: 8px 18px;
      font-size: 12px;
    }
    
    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 22px;
    }
    
    /* Hero Section with Video Background */
    .hero {
      position: relative;
      min-height: 692px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #ffffff;
    }
    
    .hero-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 0;
      object-fit: cover;
    }
    
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.5) 100%);
      z-index: 1;
    }
    
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 80px 22px;
      max-width: 980px;
      margin: 0 auto;
    }
    
    .hero h1 {
      font-size: 64px;
      font-weight: 600;
      letter-spacing: -0.009em;
      line-height: 1.0625;
      margin-bottom: 6px;
    }
    
    .hero p {
      font-size: 28px;
      line-height: 1.14286;
      font-weight: 400;
      letter-spacing: 0.007em;
      margin-bottom: 32px;
      opacity: 0.95;
    }
    
    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
    }
    
    .hero-features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 64px;
    }
    
    .hero-feature {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 24px;
      border: 0.5px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }
    
    .hero-feature-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .hero-feature h3 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.022em;
    }
    
    .hero-feature p {
      font-size: 14px;
      opacity: 0.9;
      margin: 0;
    }
    
    /* Glass Cards */
    .card {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.9) 0%, rgba(209, 250, 229, 0.85) 100%);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 18px;
      padding: 32px;
      border: 0.5px solid rgba(16, 185, 129, 0.15);
      margin-bottom: 20px;
    }
    
    /* Challenge Grid */
    .challenges-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 48px;
    }
    
    .challenge-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgba(52, 211, 153, 0.08) 100%);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 18px;
      padding: 0;
      border: 0.5px solid rgba(16, 185, 129, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      overflow: hidden;
    }
    
    .challenge-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
      border-color: rgba(52, 211, 153, 0.4);
    }
    
    .challenge-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    
    .challenge-content {
      padding: 24px;
    }
    
    .difficulty-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 980px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    
    .difficulty-easy {
      background: rgba(52, 211, 153, 0.15);
      color: #059669;
    }
    
    .difficulty-medium {
      background: rgba(251, 191, 36, 0.15);
      color: #d97706;
    }
    
    .difficulty-hard {
      background: rgba(239, 68, 68, 0.15);
      color: #dc2626;
    }
    
    .challenge-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1d1d1f;
      letter-spacing: -0.009em;
    }
    
    .challenge-description {
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.42859;
      margin-bottom: 20px;
    }
    
    .challenge-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 0.5px solid rgba(0, 0, 0, 0.06);
    }
    
    .challenge-points {
      color: #34d399;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.022em;
    }
    
    /* Leaderboard */
    .leaderboard-list {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.9) 0%, rgba(209, 250, 229, 0.85) 100%);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 18px;
      overflow: hidden;
      border: 0.5px solid rgba(16, 185, 129, 0.2);
    }
    
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.04);
      transition: background 0.2s;
    }
    
    .leaderboard-item:hover {
      background: rgba(0, 0, 0, 0.02);
    }
    
    .leaderboard-item:last-child {
      border-bottom: none;
    }
    
    .leaderboard-item.current-user {
      background: rgba(52, 211, 153, 0.08);
    }
    
    .leaderboard-rank {
      font-weight: 600;
      color: #86868b;
      margin-right: 20px;
      min-width: 40px;
      font-size: 17px;
      letter-spacing: -0.022em;
    }
    
    .leaderboard-user {
      flex: 1;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: -0.022em;
    }
    
    .leaderboard-points {
      color: #34d399;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.022em;
    }
    
    .leaderboard-badge {
      margin-left: 12px;
      font-size: 20px;
    }
    
    /* Dashboard Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.9) 0%, rgba(209, 250, 229, 0.85) 100%);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      padding: 32px;
      border-radius: 18px;
      border: 0.5px solid rgba(16, 185, 129, 0.2);
      text-align: center;
      transition: all 0.3s;
    }
    
    .stat-card:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
    }
    
    .stat-value {
      font-size: 56px;
      font-weight: 600;
      color: #34d399;
      margin-bottom: 8px;
      letter-spacing: -0.009em;
    }
    
    .stat-label {
      color: #6e6e73;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.016em;
    }
    
    /* Forms */
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 400;
      color: #1d1d1f;
      font-size: 14px;
      letter-spacing: -0.016em;
    }
    
    .form-input {
      width: 100%;
      padding: 16px;
      border: 0.5px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      font-size: 17px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      transition: all 0.3s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #34d399;
      box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.1);
      background: rgba(255, 255, 255, 0.95);
    }
    
    textarea.form-input {
      min-height: 120px;
      resize: vertical;
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 22px;
      animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .modal {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.98) 0%, rgba(209, 250, 229, 0.95) 100%);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      border: 0.5px solid rgba(16, 185, 129, 0.2);
      animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    @keyframes slideUp {
      from { 
        opacity: 0;
        transform: translateY(30px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .modal-header {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: -0.009em;
    }
    
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.05);
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #1d1d1f;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
    }
    
    .modal-close:hover {
      background: rgba(0, 0, 0, 0.1);
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 80px;
      color: #6e6e73;
    }
    
    .spinner {
      border: 3px solid rgba(0, 0, 0, 0.05);
      border-top: 3px solid #34d399;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Alerts */
    .alert {
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 400;
      backdrop-filter: blur(20px);
    }
    
    .alert-success {
      background: rgba(52, 211, 153, 0.15);
      color: #059669;
      border: 0.5px solid rgba(52, 211, 153, 0.3);
    }
    
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      color: #dc2626;
      border: 0.5px solid rgba(239, 68, 68, 0.3);
    }
    
    .alert-info {
      background: rgba(59, 130, 246, 0.15);
      color: #2563eb;
      border: 0.5px solid rgba(59, 130, 246, 0.3);
    }
    
    /* File upload */
    .file-upload {
      border: 2px dashed rgba(0, 0, 0, 0.1);
      border-radius: 18px;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px);
    }
    
    .file-upload:hover {
      border-color: #34d399;
      background: rgba(52, 211, 153, 0.05);
    }
    
    .file-upload input {
      display: none;
    }
    
    .file-preview {
      max-width: 100%;
      max-height: 400px;
      border-radius: 18px;
      margin-top: 20px;
    }
    
    /* Submissions */
    .submissions-list {
      display: grid;
      gap: 20px;
      margin-top: 48px;
    }
    
    .submission-item {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.9) 0%, rgba(209, 250, 229, 0.85) 100%);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 18px;
      padding: 28px;
      border: 0.5px solid rgba(16, 185, 129, 0.2);
      display: flex;
      gap: 24px;
      align-items: start;
      transition: all 0.3s;
    }
    
    .submission-item:hover {
      transform: scale(1.01);
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
    }
    
    .submission-image {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
    }
    
    .submission-details {
      flex: 1;
    }
    
    .submission-title {
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1d1d1f;
      letter-spacing: -0.022em;
    }
    
    .submission-date {
      color: #86868b;
      font-size: 14px;
      margin-bottom: 12px;
    }
    
    .submission-points {
      color: #34d399;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.022em;
    }
    
    /* About Section */
    .about-section {
      margin-bottom: 64px;
    }
    
    .about-section h2 {
      font-size: 40px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1d1d1f;
      letter-spacing: -0.009em;
    }
    
    .about-section p {
      font-size: 19px;
      line-height: 1.47059;
      color: #6e6e73;
      margin-bottom: 16px;
      letter-spacing: -0.022em;
    }
    
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 48px;
    }
    
    .feature-item {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.9) 0%, rgba(209, 250, 229, 0.85) 100%);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: 18px;
      padding: 32px;
      border: 0.5px solid rgba(16, 185, 129, 0.2);
      text-align: center;
      transition: all 0.3s;
    }
    
    .feature-item:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
    }
    
    .feature-icon {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    
    .feature-item h3 {
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1d1d1f;
      letter-spacing: -0.022em;
    }
    
    .feature-item p {
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.42859;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
      
      .hero h1 {
        font-size: 40px;
      }
      
      .hero p {
        font-size: 21px;
      }
      
      .challenges-grid {
        grid-template-columns: 1fr;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
      
      .submission-item {
        flex-direction: column;
      }
      
      .submission-image {
        width: 100%;
        height: 240px;
      }

      if (!timestamp) return '';

          if (window.firebaseAuth && window.firebaseFunctions) {
            clearInterval(checkFirebase);
            initAuth();
          }
        }, 100);
        
        return () => clearInterval(checkFirebase);
      }, []);
      
      const initAuth = () => {
        const { onAuthStateChanged } = window.firebaseFunctions;
        onAuthStateChanged(window.firebaseAuth, async (user) => {
          setUser(user);
          if (user) {
            await loadUserData(user.uid);
          } else {
            setUserData(null);
          }
          setLoading(false);
        });
      };
      
      const loadUserData = async (userId) => {
        try {
          const { doc, getDoc } = window.firebaseFunctions;
          const userDoc = await getDoc(doc(window.firebaseDb, 'users', userId));
          if (userDoc.exists()) {
            setUserData({ id: userDoc.id, ...userDoc.data() });
          }
        } catch (error) {
          console.error('Error loading user data:', error);
        }
      };

    function SubmitModal({ challenge, user, onClose, onSuccess }) {
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [notes, setNotes] = useState('');
      const [uploading, setUploading] = useState(false);
      const [error, setError] = useState('');
      
      const handleFile = (e) => {
        const f = e.target.files[0];
        if (f) {
          if (f.size > 5 * 1024 * 1024) {
            setError('File too large. Max 5MB.');
            return;
          }
          if (!f.type.startsWith('image/')) {
            setError('Please upload an image.');
            return;
          }
          setFile(f);
          setPreview(URL.createObjectURL(f));
          setError('');
        }
      };
      
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!file) {
          setError('Please select a photo.');
          return;
        }
        
        setUploading(true);
        try {
          const { ref, uploadBytes, getDownloadURL, addDoc, collection, doc, updateDoc, increment, getDoc, setDoc } = window.firebaseFunctions;
          
          const storageRef = ref(window.firebaseStorage, `submissions/${user.uid}/${Date.now()}_${file.name}`);
          await uploadBytes(storageRef, file);
          const photoURL = await getDownloadURL(storageRef);
          
          await addDoc(collection(window.firebaseDb, 'submissions'), {
            userId: user.uid,
            challengeId: challenge.id,
            challengeTitle: challenge.title,
            photoURL,
            notes,
            pointsEarned: challenge.points,
            submittedAt: new Date(),
            status: 'approved'
          });
          
          const userRef = doc(window.firebaseDb, 'users', user.uid);
          const userDoc = await getDoc(userRef);
          
          if (userDoc.exists()) {
            await updateDoc(userRef, {
              totalPoints: increment(challenge.points),
              challengesCompleted: increment(1),
              lastActive: new Date()
            });
          } else {
            await setDoc(userRef, {
              email: user.email,
              username: user.email.split('@')[0],
              totalPoints: challenge.points,
              challengesCompleted: 1,
              createdAt: new Date(),
              lastActive: new Date()
            });
          }
          
          alert(`Success! +${challenge.points} points! 🎉`);
          onSuccess();
        } catch (err) {
          console.error(err);
          setError('Failed to submit. Try again.');
          setUploading(false);
        }
      };
      
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={onClose}>×</button>
            <h2 className="modal-header">Submit: {challenge.title}</h2>
            
            {error && <div className="alert alert-error">{error}</div>}
            
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label className="form-label">Photo Evidence</label>
                <div className="file-upload" onClick={() => document.getElementById('file').click()}>
                  <input id="file" type="file" accept="image/*" onChange={handleFile} />
                  {preview ? (
                    <img src={preview} className="file-preview" />
                  ) : (
                    <div>
                      <div style={{ fontSize: '48px', marginBottom: '12px' }}>📸</div>
                      <p>Click to upload photo</p>
                      <p style={{ fontSize: '12px', color: '#6e6e73', marginTop: '8px' }}>Max 5MB</p>
                    </div>
                  )}
                </div>
              </div>
              
              <div className="form-group">
                <label className="form-label">Notes (optional)</label>
                <textarea 
                  className="form-input"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Tell us about your mission..."
                />
              </div>
              
              <div style={{ display: 'flex', gap: '12px', marginTop: '32px' }}>
                <button type="button" className="btn btn-secondary" onClick={onClose} disabled={uploading}>
                  Cancel
                </button>
                <button type="submit" className="btn btn-primary" disabled={uploading || !file}>
                  {uploading ? 'Submitting...' : `Submit for ${challenge.points} pts`}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }
    
    function LeaderboardPage({ user, userData }) {
      const [leaders, setLeaders] = useState([]);
      const [loading, setLoading] = useState(true);
      
      useEffect(() => {
        loadLeaders();
      }, []);
      
      const loadLeaders = async () => {
        try {
          const { collection, query, orderBy, limit, getDocs } = window.firebaseFunctions;
          const q = query(collection(window.firebaseDb, 'users'), orderBy('totalPoints', 'desc'), limit(20));
          const snap = await getDocs(q);
          const list = [];
          snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setLeaders(list);
          setLoading(false);
        } catch (err) {
          console.error(err);
          setLoading(false);
        }
      };
      
      if (loading) {
        return (
          <div className="container">
            <div className="loading">
              <div className="spinner"></div>
              <p>Loading...</p>
            </div>
          </div>
        );
      }
      
      return (
        <div className="container">
          <h1 className="page-title">Leaderboard</h1>
          <p className="page-subtitle">Top environmental champions</p>
          
          {userData && (
            <div className="card" style={{ marginBottom: '32px', background: 'rgba(52, 211, 153, 0.08)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <h3 style={{ fontSize: '21px', fontWeight: '600', marginBottom: '4px' }}>Your Stats</h3>
                  <p style={{ color: '#6e6e73' }}>
                    {userData.username || 'Champion'} • {userData.totalPoints || 0} pts • <img src={getBadge(userData.totalPoints || 0).image} alt="badge" style={{ width: '20px', height: '20px', borderRadius: '50%', objectFit: 'cover', display: 'inline-block', verticalAlign: 'middle' }} /> {getBadge(userData.totalPoints || 0).name}
                  </p>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: '32px', color: '#34d399', fontWeight: '600' }}>
                    #{leaders.findIndex(u => u.id === user?.uid) + 1}
                  </div>
                  <div style={{ fontSize: '12px', color: '#6e6e73' }}>Rank</div>
                </div>
              </div>
            </div>
          )}
          
          <div className="leaderboard-list">
            {leaders.map((leader, i) => {
              const badge = getBadge(leader.totalPoints || 0);
              const isCurrent = user && leader.id === user.uid;
              
              return (
                <div key={leader.id} className={`leaderboard-item ${isCurrent ? 'current-user' : ''}`}>
                  <span className="leaderboard-rank">#{i + 1}</span>
                  <span className="leaderboard-user">
                    {leader.username || leader.email?.split('@')[0] || 'Champion'}
                    {isCurrent && <span style={{ marginLeft: '8px', color: '#34d399' }}>(You)</span>}
                  </span>
                  <span className="leaderboard-points">
                    {leader.totalPoints || 0} pts
                    <img src={badge.image} alt={badge.name} className="leaderboard-badge" style={{ width: '24px', height: '24px', borderRadius: '50%', objectFit: 'cover' }} />
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    
    function DashboardPage({ user, userData, loadUserData }) {
      const [submissions, setSubmissions] = useState([]);
      const [loading, setLoading] = useState(true);
      
      useEffect(() => {
        if (user) loadSubs();
      }, [user]);
      
      const loadSubs = async () => {
        try {
          const { collection, query, where, orderBy, getDocs } = window.firebaseFunctions;
          const q = query(collection(window.firebaseDb, 'submissions'), where('userId', '==', user.uid), orderBy('submittedAt', 'desc'));
          const snap = await getDocs(q);
          const list = [];
          snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setSubmissions(list);
          setLoading(false);
        } catch (err) {
          console.error(err);
          setLoading(false);
        }
      };
      
      if (!user) {
        return (
          <div className="container">
            <div className="empty-state">
              <div className="empty-state-icon">🔒</div>
              <h2 style={{ fontSize: '32px', marginBottom: '8px' }}>Sign In Required</h2>
              <p>Please sign in to view dashboard</p>
            </div>
          </div>
        );
      }
      
      if (loading) {
        return (
          <div className="container">
            <div className="loading">
              <div className="spinner"></div>
              <p>Loading...</p>
            </div>
          </div>
        );
      }
      
      const badge = getBadge(userData?.totalPoints || 0);
      
      return (
        <div className="container">
          <h1 className="page-title">Dashboard</h1>
          <p className="page-subtitle">Your environmental impact</p>
          
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-value">{userData?.totalPoints || 0}</div>
              <div className="stat-label">Total Points</div>
            </div>
            <div className="stat-card">
              <div className="stat-value">{userData?.challengesCompleted || 0}</div>
              <div className="stat-label">Completed</div>
            </div>
            <div className="stat-card">
              <img src={badge.image} alt={badge.name} style={{ width: '120px', height: '120px', borderRadius: '50%', objectFit: 'cover', margin: '0 auto 16px' }} />
              <div className="stat-label">{badge.name}</div>
            </div>
          </div>
          
          <h2 style={{ fontSize: '32px', fontWeight: '600', marginBottom: '24px', letterSpacing: '-0.009em' }}>
            Your Submissions
          </h2>
          
          {submissions.length === 0 ? (
            <div className="empty-state">
              <img src="https://images.unsplash.com/photo-1452421822248-d4c2b47f0c81?w=120&h=120&fit=crop" alt="No submissions" className="empty-state-icon" />
              <p>No submissions yet</p>
            </div>
          ) : (
            <div className="submissions-list">
              {submissions.map(sub => (
                <div key={sub.id} className="submission-item">
                  <img src={sub.photoURL} className="submission-image" />
                  <div className="submission-details">
                    <h3 className="submission-title">{sub.challengeTitle}</h3>
                    <p className="submission-date">{formatDate(sub.submittedAt)}</p>
                    {sub.notes && <p style={{ color: '#6e6e73', marginBottom: '8px' }}>{sub.notes}</p>}
                    <p className="submission-points">+{sub.pointsEarned} points</p>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }
    
    function AuthPage({ setCurrentPage }) {
      const [isSignUp, setIsSignUp] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      
      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        
        try {
          const { createUserWithEmailAndPassword, signInWithEmailAndPassword, doc, setDoc } = window.firebaseFunctions;
          
          if (isSignUp) {
            const cred = await createUserWithEmailAndPassword(window.firebaseAuth, email, password);
            await setDoc(doc(window.firebaseDb, 'users', cred.user.uid), {
              email,
              username: username || email.split('@')[0],
              totalPoints: 0,
              challengesCompleted: 0,
              createdAt: new Date(),
              lastActive: new Date()
            });
            setCurrentPage('challenges');
          } else {
            await signInWithEmailAndPassword(window.firebaseAuth, email, password);
            setCurrentPage('dashboard');
          }
        } catch (err) {
          console.error(err);
          setError(err.message || 'Authentication failed');
          setLoading(false);
        }
      };
      
      return (
        <div className="container">
          <div style={{ maxWidth: '480px', margin: '80px auto' }}>
            <div className="card">
              <h2 style={{ fontSize: '32px', fontWeight: '600', marginBottom: '8px', textAlign: 'center', letterSpacing: '-0.009em' }}>
                {isSignUp ? 'Create Account' : 'Sign In'}
              </h2>
              <p style={{ textAlign: 'center', color: '#6e6e73', marginBottom: '32px', fontSize: '17px' }}>
                {isSignUp ? 'Start your adventure' : 'Welcome back'}
              </p>
              
              {error && <div className="alert alert-error">{error}</div>}
              
              <form onSubmit={handleSubmit}>
                {isSignUp && (
                  <div className="form-group">
                    <label className="form-label">Username</label>
                    <input 
                      type="text"
                      className="form-input"
                      value={username}
                      onChange={(e) => setUsername(e.target.value)}
                      placeholder="Choose username"
                    />
                  </div>
                )}
                
                <div className="form-group">
                  <label className="form-label">Email</label>
                  <input 
                    type="email"
                    className="form-input"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required
                    placeholder="your@email.com"
                  />
                </div>
                
                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input 
                    type="password"
                    className="form-input"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required
                    placeholder="••••••••"
                    minLength="6"
                  />
                </div>
                
                <button 
                  type="submit" 
                  className="btn btn-primary" 
                  style={{ width: '100%', marginTop: '16px' }}
                  disabled={loading}
                >
                  {loading ? 'Processing...' : (isSignUp ? 'Create Account' : 'Sign In')}
                </button>
              </form>
              
              <div style={{ textAlign: 'center', marginTop: '24px' }}>
                <button 
                  className="btn btn-ghost"
                  onClick={() => {
                    setIsSignUp(!isSignUp);
                    setError('');
                  }}
                >
                  {isSignUp ? 'Already have account? Sign in' : 'Need account? Sign up'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }
    
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
